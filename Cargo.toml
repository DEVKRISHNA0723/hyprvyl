[package]
name = "hyprvyl"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
evdev = "0.13.2"
gdk-pixbuf = "0.22.0"
gtk4 = "0.11.4"
gtk4-layer-shell = "0.8.1"
libc = "0.2.189"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
